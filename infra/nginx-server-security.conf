location = /api/auth/csrf {
  limit_req zone=dondok_csrf burst=20 nodelay;
  include /etc/nginx/dondok/api-proxy.conf;
}

location ^~ /api/auth/login-ids/ {
  limit_req zone=dondok_auth burst=5 nodelay;
  include /etc/nginx/dondok/api-proxy.conf;
}

location ~ ^/api/auth/(sign-up|email-verifications|session|password-resets|password-resets/confirm)$ {
  limit_req zone=dondok_auth burst=5 nodelay;
  include /etc/nginx/dondok/api-proxy.conf;
}

location ~ ^/api/ledger-invitations/(preview|redemptions)$ {
  limit_req zone=dondok_invite burst=10 nodelay;
  include /etc/nginx/dondok/api-proxy.conf;
}
