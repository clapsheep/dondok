set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_status 429;
limit_req_zone $binary_remote_addr zone=dondok_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dondok_invite:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=dondok_csrf:10m rate=60r/m;
