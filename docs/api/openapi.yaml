openapi: 3.1.0
info:
  title: Dondok API
  version: 0.12.0
  description: 돈독 프론트엔드와 백엔드 사이의 HTTP 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /api/auth/csrf:
    get:
      summary: CSRF token 조회
      operationId: getCsrfToken
      tags: [Authentication]
      responses:
        "200":
          description: 현재 브라우저 세션용 CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/login-ids/{loginId}/availability:
    get:
      summary: 로그인 아이디 중복 확인
      operationId: getLoginIdAvailability
      tags: [Authentication]
      parameters:
        - name: loginId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{4,30}$" }
      responses:
        "200":
          description: 아이디 사용 가능 여부
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/sign-up:
    post:
      summary: 회원가입
      operationId: signUp
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "202":
          description: 가입 완료, 이메일 인증 대기
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/auth/email-verifications:
    post:
      summary: 이메일 인증
      operationId: verifyEmail
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: 이메일 인증 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/session:
    post:
      summary: 세션 로그인
      operationId: login
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 완료
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 최대 90일 유지되는 HttpOnly DONDOK_SESSION cookie. 서버 세션은 마지막 사용 후 30일 또는 생성 후 90일에 만료된다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: 현재 세션 로그아웃
      operationId: logout
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "204": { description: 현재 세션 로그아웃 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/sessions:
    delete:
      summary: 모든 세션 로그아웃
      operationId: logoutAll
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "204": { description: 모든 세션 로그아웃 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/me:
    get:
      summary: 현재 로그인 사용자 조회
      operationId: getCurrentUser
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 현재 로그인 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/password-resets:
    post:
      summary: 비밀번호 재설정 메일 요청
      operationId: requestPasswordReset
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        "202": { description: 계정 존재 여부와 무관하게 동일한 응답 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/password-resets/confirm:
    post:
      summary: 비밀번호 재설정 확정
      operationId: confirmPasswordReset
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 200 }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: 비밀번호 변경과 기존 전체 세션 만료 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/ledger-books/current:
    get:
      summary: 현재 사용자의 가계부와 구성원 조회
      operationId: getCurrentLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 가계부가 없으면 ledger는 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentLedgerBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: 현재 가계부 전체 삭제
      description: 모든 구성원이 같은 권한으로 실행할 수 있다. 가계부 하위 데이터와 멤버십은 한 트랜잭션에서 물리 삭제하지만 사용자 계정과 로그인 세션은 유지한다.
      operationId: deleteCurrentLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerBookDeletionRequest" }
      responses:
        "204": { description: 가계부와 모든 하위 데이터 삭제 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/ledger-books:
    post:
      summary: 현재 계정의 가계부와 생성자 멤버십 생성
      operationId: createLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "201":
          description: 생성된 가계부와 생성자 멤버십
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/ledger-books/current/invitations:
    get:
      summary: 현재 가계부의 발급 초대 목록
      operationId: getLedgerInvitations
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 원문 token을 제외한 초대 상태 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerInvitationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: 7일·1회용 초대 URL과 코드 발급
      operationId: createLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "201":
          description: 직접 입력용 숫자 6자리 code와 별도 고강도 token URL은 이 응답에서만 제공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedLedgerInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/ledger-books/current/invitations/{invitationId}:
    delete:
      summary: 사용 가능한 초대 취소
      operationId: revokeLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 초대 취소 완료 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/ledger-invitations/preview:
    post:
      summary: 초대 URL 또는 직접 코드 미리보기
      operationId: previewLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCodeRequest" }
      responses:
        "200":
          description: token을 소비하지 않은 참여 확인 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerInvitationPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/ledger-invitations/redemptions:
    post:
      summary: 초대 수락과 즉시 가계부 참여
      operationId: redeemLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCodeRequest" }
      responses:
        "201":
          description: 참여한 가계부와 갱신된 구성원
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerBook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/asset-types:
    get:
      summary: 현재 가계부의 활성 자산 유형 목록
      operationId: getAssetTypes
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 가계부마다 제공되는 고정 시스템 자산 종류
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/assets:
    get:
      summary: 현재 가계부의 상태별 자산 목록
      operationId: getAssets
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: 기본은 신규 거래에 사용할 수 있는 활성 자산만 반환한다.
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED, ALL]
            default: ACTIVE
      responses:
        "200":
          description: 상태 조건에 맞는 자산, 현재 잔액, 종류 코드와 카드 결제 예정액
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: 자산과 최초 잔액 원장 등록
      operationId: createAsset
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssetRequest" }
      responses:
        "201":
          description: 생성된 자산의 authoritative 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 현재 가계부의 사용 중 또는 사용 종료 자산 상세
      operationId: getAsset
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 자산 상세와 현재 잔액
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: expected version 기준 자산·최초 잔액·카드 설정 전체 수정
      operationId: updateAsset
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssetRequest" }
      responses:
        "200":
          description: 수정된 자산의 authoritative 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      summary: 최신 정리 미리보기 기준 자산 완전 삭제 또는 사용 종료
      description: 최초 금액 내부 기록을 제외한 실제 거래 이력과 보존해야 할 비활성 설정 참조가 모두 없으면 완전 삭제하고, 하나라도 있으면 사용 종료 상태로 전환한다. 사용 종료한 카드는 미처리 예약 결제를 취소하고 새 선결제를 거부한다. 활성 연결 계좌로 사용 중이면 409로 거부한다.
      operationId: removeAsset
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: previewToken
          in: query
          required: true
          description: 직전 정리 미리보기의 이력·잔액·연결 상태를 확인하는 token
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200":
          description: 서버가 실제 적용한 완전 삭제 또는 사용 종료 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetRemovalResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/assets/{assetId}/removal-preview:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 자산 정리 결과·경고·차단 연결 미리보기
      operationId: previewAssetRemoval
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 현재 authoritative 상태로 계산한 정리 미리보기
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetRemovalPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/assets/{assetId}/restore:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: 사용 종료 자산을 다시 사용
      description: 가계부와 자산 행을 잠그고 활성 자산 50개 제한과 연결 계좌 유효성을 다시 확인한다.
      operationId: restoreAsset
      tags: [Asset]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: 복원된 authoritative 자산
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/assets/{assetId}/transactions:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 자산과 연결된 거래 cursor 목록
      description: 자산을 직접 선택한 거래와 해당 자산 잔액을 바꾼 posting을 최신 날짜 우선으로 한 번씩 반환한다. 사용 종료 자산의 과거 거래도 조회할 수 있다.
      operationId: getAssetTransactions
      tags: [Transaction]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          description: 서버가 발급한 날짜·생성 시각·ID 기반 opaque cursor
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 해당 자산을 사용했거나 잔액에 반영된 최신순 거래 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/assets/{cardAssetId}/card-statements:
    parameters:
      - name: cardAssetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 카드 자산의 미결제 중심 명세 cursor 목록
      description: 같은 가계부의 사용 종료 카드도 과거 명세 조회를 허용하되 새 선결제는 거부한다. 기본값은 OPEN·FINALIZED만 반환하며 includePaid=true이면 최근 PAID도 포함한다.
      operationId: getCardStatements
      tags: [CardStatement]
      security: [{ cookieAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: includePaid
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 결제일·식별자 내림차순의 bounded 명세 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardStatementPage" }
