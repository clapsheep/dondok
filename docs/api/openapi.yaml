openapi: 3.1.0
info:
  title: Dondok API
  version: 0.12.0
  description: 돈독 프론트엔드와 백엔드 사이의 HTTP 계약
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /api/legal:
    get:
      summary: 공개 가입 동의 문서와 버전
      operationId: legalDocuments
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: 문서 버전은 동의 증거와 함께 보관. 변경 시 새로운 버전을 발행한다.
          content:
            application/json:
              schema:
                type: object
                required: [version, terms, privacy, collection]
                properties:
                  version: { type: string }
                  terms: { type: string }
                  privacy: { type: string }
                  collection: { type: string }
  /api/assets/{cardAssetId}/card-payment-items:
    parameters:
      - { name: cardAssetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listCardPaymentItems
      summary: 카드 회차별 미결제 내역과 최근 정산일 기본 선택 합계
      tags: [CardStatement]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        "200":
          description: 아직 조회하지 않은 페이지도 포함한 합계와 선택 snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPaymentItemPage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /api/assets/{cardAssetId}/card-payments:
    parameters:
      - { name: cardAssetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordCardItemPayment
      summary: 선택 내역 또는 부분 금액을 선택 계좌와 실제 날짜로 원자적 결제 기록
      tags: [CardStatement]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardItemPaymentRequest' }
      responses:
        "201":
          description: 명세별 결제 기록; 같은 요청 재시도는 같은 batch 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardItemPaymentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "412": { $ref: '#/components/responses/PreconditionFailed' }
  /api/auth/csrf:
    get:
      summary: CSRF token 조회
      operationId: getCsrfToken
      tags: [Authentication]
      responses:
        "200":
          description: 현재 브라우저 세션용 CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/login-ids/{loginId}/availability:
    get:
      summary: 로그인 아이디 중복 확인
      operationId: getLoginIdAvailability
      tags: [Authentication]
      parameters:
        - name: loginId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{4,30}$" }
      responses:
        "200":
          description: 아이디 사용 가능 여부
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/sign-up:
    post:
      summary: 회원가입
      operationId: signUp
      description: 필수 확인/동의 누락 또는 false는 SIGNUP_CONSENT_REQUIRED(400), 현재 문서 버전 불일치는 SIGNUP_CONSENT_VERSION_CHANGED(409). 가입과 동의 증거 저장은 원자적이다.
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "202":
          description: 가입 완료, 이메일 인증 대기
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/auth/email-verifications:
    post:
      summary: 이메일 인증
      operationId: verifyEmail
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: 이메일 인증 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/session:
    post:
      summary: 세션 로그인
      operationId: login
      description: 유효한 인증 성공 시 최근 이용 시각을 갱신하고 휴면 표시를 해제한다. 미인증·잠금·탈퇴 계정의 인증 제한은 유지한다.
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 완료
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 최대 90일 유지되는 HttpOnly DONDOK_SESSION cookie. 서버 세션은 마지막 사용 후 30일 또는 생성 후 90일에 만료된다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: 현재 세션 로그아웃
      operationId: logout
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "204": { description: 현재 세션 로그아웃 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/sessions:
    delete:
      summary: 모든 세션 로그아웃
      operationId: logoutAll
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "204": { description: 모든 세션 로그아웃 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/me:
    delete:
      summary: 회원 탈퇴 및 모든 세션 폐기
      operationId: withdrawAccount
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmed, expectedLedgerId, expectedVersion]
              properties:
                password: { type: string, format: password, maxLength: 128 }
                confirmed: { type: boolean, const: true }
                expectedLedgerId: { type: [string, "null"], format: uuid }
                expectedVersion: { type: [integer, "null"], format: int64, minimum: 0 }
      responses:
        "204": { description: 실제 계정·인증·세션·동의 기록 삭제. 가계부별 시스템 구성원으로 참조 통합 및 관련 텍스트 정리. 금액·posting·정산은 보존하며 마지막 구성원이면 가계부 전체 삭제. }
        "400": { description: ACCOUNT_WITHDRAWAL_CONFIRMATION_REQUIRED 또는 입력 검증 실패 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: ACCOUNT_PASSWORD_INVALID 또는 CSRF 검증 실패 }
        "412": { description: ACCOUNT_WITHDRAWAL_STALE. 가계부 ID 또는 version이 바뀌었으므로 최신 영향 확인 후 다시 요청. }
    get:
      summary: 현재 로그인 사용자 조회
      operationId: getCurrentUser
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 현재 로그인 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/profile:
    get:
      summary: 편집할 최신 계정 정보와 version 조회
      operationId: getAccountProfile
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 최신 프로필
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: 현재 비밀번호 확인 후 이름과 인증된 이메일 저장
      operationId: saveAccountProfile
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email, password, expectedVersion]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, format: password, maxLength: 128 }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: 저장된 프로필. 이메일 변경 시 기존 비밀번호 재설정 링크도 폐기.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400": { description: EMAIL_CHANGE_NOT_VERIFIED 또는 입력 검증 실패 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: ACCOUNT_PASSWORD_INVALID 또는 CSRF 오류 }
        "409": { description: EMAIL_ALREADY_EXISTS 또는 RESOURCE_CONFLICT }
        "412": { description: VERSION_CONFLICT. draft 유지 후 최신 정보 확인 필요. }
  /api/auth/profile/email-verification:
    post:
      summary: 새 이메일로 10분 유효한 8자리 인증번호 전송
      operationId: requestEmailChange
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, expectedVersion]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        "202": { description: 전송 요청 완료. 재전송은 60초 후 가능하며 이전 인증번호는 무효. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: EMAIL_ALREADY_EXISTS }
        "412": { description: VERSION_CONFLICT }
        "429": { description: EMAIL_CHANGE_RATE_LIMITED }
  /api/auth/profile/email-verification/confirm:
    post:
      summary: 현재 사용자·새 이메일에 연결된 인증번호 확인 (최대 5회)
      operationId: confirmEmailChange
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                code: { type: string, pattern: '^[0-9]{8}$' }
      responses:
        "204": { description: 인증 완료. 유효기간 내 별도 프로필 저장까지 기존 이메일 유지. }
        "400": { description: EMAIL_CHANGE_CODE_INVALID. 만료·횟수 초과·잘못된 번호. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/password:
    put:
      summary: 현재 비밀번호 확인 후 비밀번호 변경 및 전체 세션 폐기
      operationId: changeAccountPassword
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, newPasswordConfirm]
              properties:
                currentPassword: { type: string, format: password, maxLength: 128 }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
                newPasswordConfirm: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: "비밀번호 변경, 모든 세션·재설정 링크·이메일 변경 인증 폐기" }
        "400": { description: PASSWORD_CONFIRMATION_MISMATCH 또는 입력 검증 실패 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: ACCOUNT_PASSWORD_INVALID 또는 CSRF 오류 }
  /api/auth/password-resets:
    post:
      summary: 비밀번호 재설정 메일 요청
      operationId: requestPasswordReset
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        "202": { description: 계정 존재 여부와 무관하게 동일한 응답 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/auth/password-resets/confirm:
    post:
      summary: 비밀번호 재설정 확정
      operationId: confirmPasswordReset
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 200 }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: 비밀번호 변경과 기존 전체 세션 만료 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/ledger-books/current:
    get:
      summary: 현재 사용자의 가계부와 구성원 조회
      operationId: getCurrentLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 가계부가 없으면 ledger는 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentLedgerBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: 현재 가계부 전체 삭제
      description: 모든 구성원이 같은 권한으로 실행할 수 있다. 가계부 하위 데이터와 멤버십은 한 트랜잭션에서 물리 삭제하지만 사용자 계정과 로그인 세션은 유지한다.
      operationId: deleteCurrentLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedgerBookDeletionRequest" }
      responses:
        "204": { description: 가계부와 모든 하위 데이터 삭제 완료 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/ledger-books:
    post:
      summary: 현재 계정의 가계부와 생성자 멤버십 생성
      operationId: createLedgerBook
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "201":
          description: 생성된 가계부와 생성자 멤버십
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/ledger-books/current/invitations:
    get:
      summary: 현재 가계부의 발급 초대 목록
      operationId: getLedgerInvitations
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 원문 token을 제외한 초대 상태 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerInvitationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: 7일·1회용 초대 URL과 코드 발급
      operationId: createLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "201":
          description: 직접 입력용 숫자 6자리 code와 별도 고강도 token URL은 이 응답에서만 제공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedLedgerInvitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/ledger-books/current/invitations/{invitationId}:
    delete:
      summary: 사용 가능한 초대 취소
      operationId: revokeLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 초대 취소 완료 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/ledger-invitations/preview:
    post:
      summary: 초대 URL 또는 직접 코드 미리보기
      operationId: previewLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCodeRequest" }
      responses:
        "200":
          description: token을 소비하지 않은 참여 확인 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerInvitationPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/ledger-invitations/redemptions:
    post:
      summary: 초대 수락과 즉시 가계부 참여
      operationId: redeemLedgerInvitation
      tags: [Membership]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCodeRequest" }
      responses:
        "201":
          description: 참여한 가계부와 갱신된 구성원
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerBook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/asset-types:
    get:
      summary: 현재 가계부의 활성 자산 유형 목록
      operationId: getAssetTypes
      tags: [Asset]
