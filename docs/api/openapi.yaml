          application/json:
            schema:
              type: object
              required: [expectedVersion, expectedAmountWon, settlementAssetId]
              properties:
                paidOn:
                  type: string
                  format: date
                  description: 실제 결제일. 결제 이력과 출금·카드 이체의 경제활동일에 함께 사용한다. 생략 시 서울 실행일로 처리한다.
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                expectedAmountWon: { type: integer, format: int64, minimum: 1 }
                settlementAssetId: { type: string, format: uuid }
      responses:
        "201":
          description: 결제 후 명세·MANUAL 결제·이체 거래
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardStatementPaymentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
