              schema: { $ref: "#/components/schemas/CardPurchaseRefundPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/transactions/{transactionId}/card-purchase-refunds:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: 실제 환불일의 지출 상쇄와 카드·원 결제 계좌 반환 기록
      operationId: applyCardPurchaseRefund
      tags: [Transaction]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyCardPurchaseRefundRequest" }
      responses:
        "201":
          description: 생성된 환불 거래와 카드·계좌 반영 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardPurchaseRefundResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: DONDOK_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 사용자의 동일 키·동일 payload 재시도는 기존 리소스의 동일 명령 결과를 반환한다.
      schema: { type: string, minLength: 1, maxLength: 100 }
  schemas:
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string, const: X-CSRF-TOKEN }
        parameterName: { type: string }
        token: { type: string }
    SignUpRequest:
      type: object
      required: [loginId, displayName, email, password]
      properties:
        loginId: { type: string, pattern: "^[A-Za-z0-9._-]{4,30}$" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }
    SessionUser:
      type: object
      required: [userId, loginId, displayName, email]
      properties:
        userId: { type: string, format: uuid }
        loginId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
    CurrentLedgerBook:
      type: object
      required: [ledger]
      properties:
        ledger:
          oneOf:
            - { $ref: "#/components/schemas/LedgerBook" }
            - { type: "null" }
    LedgerBook:
      type: object
      required: [ledgerId, version, members]
      properties:
        ledgerId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        members:
          type: array
          items: { $ref: "#/components/schemas/LedgerMember" }
    LedgerBookDeletionRequest:
      type: object
      required: [expectedLedgerId, expectedVersion, confirmationPhrase]
      properties:
        expectedLedgerId:
          type: string
          format: uuid
          description: 삭제 확인 dialog를 열 때 보던 가계부 식별자. 삭제 후 새 가계부가 생긴 ABA 경합에서 새 가계부 삭제를 방지한다.
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        confirmationPhrase:
          type: string
          const: 가계부 삭제
          description: 실수로 전체 데이터를 지우지 않도록 사용자가 직접 입력한 확인 문구
    LedgerMember:
      type: object
      required: [memberId, displayName, joinedAt, currentUser]
      properties:
        memberId: { type: string, format: uuid }
        displayName: { type: string }
        joinedAt: { type: string, format: date-time }
        currentUser: { type: boolean }
    LedgerInvitationSummary:
      type: object
      required: [invitationId, status, createdAt, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, REDEEMED, REVOKED, EXPIRED] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    IssuedLedgerInvitation:
      allOf:
        - { $ref: "#/components/schemas/LedgerInvitationSummary" }
        - type: object
          required: [code, inviteUrl]
          properties:
            code:
              type: string
              pattern: "^[0-9]{6}$"
              description: 사람이 직접 입력하는 숫자 6자리 코드
            inviteUrl: { type: string, format: uri }
    InvitationCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          description: 숫자 6자리 직접 입력 코드 또는 초대 URL에 포함된 고강도 token
          oneOf:
            - { type: string, pattern: "^[0-9]{6}$" }
            - { type: string, minLength: 32, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
    LedgerInvitationPreview:
      type: object
      required: [memberNames, memberCount, expiresAt]
      properties:
        memberNames:
          type: array
          items: { type: string }
        memberCount: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    AssetBehavior:
      type: string
      enum: [STANDARD, CREDIT_CARD, DEBIT_CARD, SAVINGS]
    AssetOwnershipScope:
      type: string
      enum: [PERSONAL, JOINT]
    FinancialInstitutionCode:
      type: string
      enum:
        - OTHER
        - KB_KOOKMIN
        - SHINHAN
        - HANA
        - WOORI
        - NH
        - IBK
        - KAKAO_BANK
        - K_BANK
        - TOSS_BANK
        - SC
        - CITI
        - KDB
        - SUHYUP
        - POST_OFFICE
        - MG
        - CREDIT_UNION
        - SAVINGS_BANK
        - BNK_BUSAN
        - BNK_GYEONGNAM
        - IM_BANK
        - GWANGJU
        - JEONBUK
        - JEJU
        - HYUNDAI_CAPITAL
        - KB_CAPITAL
        - SHINHAN_CAPITAL
        - HANA_CAPITAL
        - WOORI_FINANCIAL_CAPITAL
        - NH_CAPITAL
        - LOTTE_CAPITAL
        - BNK_CAPITAL
        - JB_WOORI_CAPITAL
        - MIRAE_ASSET_SEC
        - KOREA_INVESTMENT_SEC
        - NH_INVESTMENT_SEC
        - SAMSUNG_SEC
        - KB_SEC
        - KIWOOM_SEC
        - SHINHAN_SEC
        - HANA_SEC
        - MERITZ_SEC
        - DAISHIN_SEC
        - HANWHA_SEC
        - HYUNDAI_MOTOR_SEC
        - DB_SEC
        - YUANTA_SEC
        - EUGENE_SEC
        - SK_SEC
        - IBK_SEC
        - KAKAO_PAY_SEC
        - TOSS_SEC
        - LS_SEC
        - SHINYOUNG_SEC
    CardIssuerCode:
      type: string
      enum: [OTHER, KB_KOOKMIN, SHINHAN, SAMSUNG, HYUNDAI, LOTTE, WOORI, HANA, BC, NH]
    AssetType:
      type: object
      description: 사용자가 추가하거나 이름을 바꿀 수 없는 고정 시스템 자산 종류
      required: [assetTypeId, systemCode, name, behavior, paymentSourceCapable]
      properties:
        assetTypeId: { type: string, format: uuid }
        systemCode:
          type: string
          enum: [CASH, BANK, CREDIT_CARD, DEBIT_CARD, SAVINGS, INVESTMENT, LOAN, INSURANCE, OTHER]
        name: { type: string }
        behavior: { $ref: "#/components/schemas/AssetBehavior" }
        paymentSourceCapable: { type: boolean }
    CardSettingsInput:
      type: object
      description: 신용카드 생성·수정에서 필수이며 settlementAssetId는 자동 정산 사용 여부와 무관하게 필요하다.
      required: [statementClosingDay, paymentDay, paymentMonthOffset, settlementAssetId, autoSettlementEnabled]
      properties:
        statementClosingDay: { type: integer, minimum: 1, maximum: 31 }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        paymentMonthOffset: { type: integer, minimum: 0, maximum: 2 }
        settlementAssetId: { type: string, format: uuid }
        autoSettlementEnabled: { type: boolean }
    DebitCardSettingsInput:
      type: object
      description: 체크카드 생성·수정에서 필수이며 지출 posting이 차감될 결제 계좌를 지정한다.
      required: [paymentAssetId]
      properties:
        paymentAssetId: { type: string, format: uuid }
    SavingsSettingsInput:
      type: object
      description: 적금에서 자동이체를 사용할 때만 보내는 출금 계좌와 달력일 설정이다. 객체를 보내면 두 필드가 모두 필요하고, 자동이체를 사용하지 않으면 null이다. 자동 실행 정책은 별도 범위다.
      required: [transferAssetId, transferDay]
      properties:
        transferAssetId: { type: string, format: uuid }
        transferDay: { type: integer, minimum: 1, maximum: 31 }
    AssetInput:
      type: object
      required: [assetTypeId, ownershipScope, name, openedOn, openingBalanceWon]
      properties:
        assetTypeId:
          type: string
          format: uuid
          description: 현재 가계부의 고정 시스템 자산 종류 ID
        ownershipScope: { $ref: "#/components/schemas/AssetOwnershipScope" }
        ownerMemberId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        financialInstitutionCode:
          description: BANK·SAVINGS는 은행·상호금융, LOAN은 은행·캐피탈, INVESTMENT는 증권사 정적 코드를 저장한다. 생략하면 OTHER로 저장되며 다른 자산 종류에서는 null로 정규화한다.
          oneOf:
            - { $ref: "#/components/schemas/FinancialInstitutionCode" }
            - { type: "null" }
        cardIssuerCode:
          description: CREDIT_CARD·DEBIT_CARD 자산의 카드사 코드다. 생략하면 OTHER로 저장되며 다른 자산 종류에서는 null로 정규화한다.
          oneOf:
            - { $ref: "#/components/schemas/CardIssuerCode" }
            - { type: "null" }
        name: { type: string, minLength: 1, maxLength: 100 }
        openedOn: { type: string, format: date }
        memo:
          oneOf:
            - { type: string, maxLength: 1000 }
            - { type: "null" }
        openingBalanceWon: { type: integer, format: int64 }
        cardSettings:
          description: CREDIT_CARD 유형에서는 필수, 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/CardSettingsInput" }
            - { type: "null" }
        debitCardSettings:
          description: DEBIT_CARD 유형에서는 필수, 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/DebitCardSettingsInput" }
            - { type: "null" }
        savingsSettings:
          description: SAVINGS 유형에서 자동이체를 설정할 때만 사용하며 설정하지 않으면 null이다. 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/SavingsSettingsInput" }
            - { type: "null" }
    CreateAssetRequest:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
    UpdateAssetRequest:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
        - type: object
          required: [expectedVersion, reassignTransactionsToNewOwner]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 0 }
            reassignTransactionsToNewOwner:
              type: boolean
              description: PERSONAL owner가 실제 변경될 때만 true를 허용하며 그 외에는 false다.
    CardSettings:
      type: object
      required: [statementClosingDay, paymentDay, paymentMonthOffset, settlementAssetId, autoSettlementEnabled]
      properties:
        statementClosingDay: { type: integer, minimum: 1, maximum: 31 }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        paymentMonthOffset: { type: integer, minimum: 0, maximum: 2 }
        settlementAssetId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        autoSettlementEnabled: { type: boolean }
    DebitCardSettings:
      allOf:
        - { $ref: "#/components/schemas/DebitCardSettingsInput" }
    SavingsSettings:
      allOf:
        - { $ref: "#/components/schemas/SavingsSettingsInput" }
    Asset:
      type: object
      required:
        - assetId
        - assetTypeId
        - systemCode
        - assetTypeName
        - behavior
        - paymentSourceCapable
        - ownershipScope
        - ownerMemberId
        - financialInstitutionCode
        - cardIssuerCode
        - name
        - openedOn
        - memo
        - openingBalanceWon
        - currentBalanceWon
        - currentMonthCardPaymentDueWon
        - nextMonthCardPaymentDueWon
        - nearestCardPaymentDueOn
        - nearestCardPaymentDueWon
        - followingCardPaymentDueOn
        - followingCardPaymentDueWon
        - status
        - archivedAt
        - version
        - cardSettings
        - debitCardSettings
        - savingsSettings
      properties:
        assetId: { type: string, format: uuid }
        assetTypeId: { type: string, format: uuid }
        systemCode:
          type: string
          enum: [CASH, BANK, CREDIT_CARD, DEBIT_CARD, SAVINGS, INVESTMENT, LOAN, INSURANCE, OTHER]
        assetTypeName: { type: string }
        behavior: { $ref: "#/components/schemas/AssetBehavior" }
        paymentSourceCapable: { type: boolean }
        ownershipScope: { $ref: "#/components/schemas/AssetOwnershipScope" }
        ownerMemberId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        financialInstitutionCode:
          oneOf:
            - { $ref: "#/components/schemas/FinancialInstitutionCode" }
            - { type: "null" }
        cardIssuerCode:
          oneOf:
            - { $ref: "#/components/schemas/CardIssuerCode" }
            - { type: "null" }
        name: { type: string }
        openedOn: { type: string, format: date }
        memo:
          oneOf:
            - { type: string }
            - { type: "null" }
        openingBalanceWon: { type: integer, format: int64 }
        currentBalanceWon: { type: integer, format: int64 }
        currentMonthCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Asia/Seoul 기준 현재 달에 결제 예정인 이 자산의 미결제 카드 명세 합계이며 카드가 아니면 0이다.
        nextMonthCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Asia/Seoul 기준 다음 달에 결제 예정인 이 자산의 미결제 카드 명세 합계이며 카드가 아니면 0이다.
        nearestCardPaymentDueOn:
          description: 아직 결제되지 않은 카드 명세 중 가장 이른 결제일이며, 없거나 카드가 아니면 null이다. 결제일이 지난 미결제 명세도 누락하지 않는다.
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        nearestCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          description: nearestCardPaymentDueOn에 결제할 미결제 명세 합계이며, 없거나 카드가 아니면 0이다.
        followingCardPaymentDueOn:
          description: nearestCardPaymentDueOn 다음으로 이른 미결제 카드 명세의 결제일이며, 없거나 카드가 아니면 null이다.
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        followingCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          description: followingCardPaymentDueOn에 결제할 미결제 명세 합계이며, 없거나 카드가 아니면 0이다.
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        archivedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        version: { type: integer, format: int64 }
        cardSettings:
          oneOf:
            - { $ref: "#/components/schemas/CardSettings" }
            - { type: "null" }
        debitCardSettings:
          oneOf:
            - { $ref: "#/components/schemas/DebitCardSettings" }
            - { type: "null" }
        savingsSettings:
          oneOf:
            - { $ref: "#/components/schemas/SavingsSettings" }
            - { type: "null" }
    AssetRemovalDisposition:
      type: string
      enum: [DELETE, ARCHIVE]
    AssetRemovalBlockingLink:
      type: object
      required: [kind, assetId, assetName]
      properties:
        kind:
          type: string
          enum: [CREDIT_CARD_SETTLEMENT, DEBIT_CARD_PAYMENT, SAVINGS_TRANSFER, CARD_PAYMENT_SCHEDULE]
        assetId: { type: string, format: uuid }
