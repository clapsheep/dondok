        schema: { type: string, format: uuid }
    get:
      summary: 자산과 연결된 거래 cursor 목록
      description: 자산을 직접 선택한 거래와 해당 자산 잔액을 바꾼 posting을 최신 날짜 우선으로 한 번씩 반환한다. 사용 종료 자산의 과거 거래도 조회할 수 있다. 검색·필터는 전체 자산 이력에 적용한 뒤 cursor로 반환하며 조건을 바꾸면 cursor를 초기화한다. 잘못된 검색어·기간은 TRANSACTION_FILTER_INVALID로 거부한다.
      operationId: getAssetTransactions
