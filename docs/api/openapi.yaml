        fallbackCategoryName: { type: string }
        remappedTransactionCount: { type: integer, format: int64, minimum: 0 }
        firstOccurredOn:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        lastOccurredOn:
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER]
    TransferSubtype:
      type: string
      enum: [NORMAL, CARD_SETTLEMENT, CARD_PREPAYMENT]
    TransactionInput:
      type: object
      required: [type, occurredOn, amountWon, performedByMemberId]
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        occurredOn: { type: string, format: date }
        amountWon: { type: integer, format: int64, minimum: 1 }
        performedByMemberId: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
    CreateIncomeRequest:
      allOf:
        - { $ref: "#/components/schemas/TransactionInput" }
        - type: object
          required: [categoryId, assetId]
          properties:
            type: { type: string, const: INCOME }
            categoryId: { type: string, format: uuid }
            assetId: { type: string, format: uuid }
            excludedFromStatistics:
              type: boolean
              default: false
              description: true면 posting과 자산 잔액은 반영하되 달력·통계 집계에서 제외한다.
    CreateExpenseRequest:
      allOf:
        - { $ref: "#/components/schemas/TransactionInput" }
        - type: object
          required: [categoryId, assetId]
          properties:
            type: { type: string, const: EXPENSE }
            categoryId: { type: string, format: uuid }
            assetId: { type: string, format: uuid }
            installmentCount: { type: integer, minimum: 1, maximum: 60, default: 1 }
            statisticsAmountWon:
              type: integer
              format: int64
              minimum: 0
              description: 대표 결제에서 달력·통계의 지출로 반영할 금액이다. 실제 결제액 이하이며 생략하면 amountWon과 같다.
            excludedFromStatistics:
              type: boolean
              default: false
              description: true면 posting과 자산 잔액은 반영하되 달력·통계 집계에서 제외한다.
    TransferPurpose:
      type: string
      enum: [GENERAL, SAVINGS_DEPOSIT, INVESTMENT_DEPOSIT, SAVINGS_WITHDRAWAL, INVESTMENT_WITHDRAWAL]
      description: 일반 이체 목적. 자산 종류와 독립된 저장 값이며 생성 생략은 GENERAL, 수정 생략은 기존값 보존이다.
    CreateTransferRequest:
      allOf:
        - { $ref: "#/components/schemas/TransactionInput" }
        - type: object
          required: [sourceAssetId, destinationAssetId]
          properties:
            type: { type: string, const: TRANSFER }
            transferPurpose: { $ref: "#/components/schemas/TransferPurpose" }
            sourceAssetId: { type: string, format: uuid, description: "같은 가계부의 활성 BANK 계좌, SAVINGS 적금 또는 INVESTMENT 주식 계좌 자산 ID" }
            destinationAssetId: { type: string, format: uuid, description: "출발 자산과 같은 명의이며 서로 다른 활성 BANK 계좌, SAVINGS 적금 또는 INVESTMENT 주식 계좌 자산 ID" }
    UpdateTransactionRequest:
      type: object
      required: [type, occurredOn, amountWon, performedByMemberId, expectedVersion]
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        transferPurpose: { $ref: "#/components/schemas/TransferPurpose" }
        occurredOn: { type: string, format: date }
        amountWon: { type: integer, format: int64, minimum: 1 }
        categoryId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        installmentCount:
          type: integer
          minimum: 1
          maximum: 60
          default: 1
          description: EXPENSE의 결제 자산을 신용카드로 변경할 때 사용하며 생략하면 일시불로 처리한다.
        sourceAssetId: { type: string, format: uuid, description: "TRANSFER 수정에서만 사용하는 활성 BANK 계좌, SAVINGS 적금 또는 INVESTMENT 주식 계좌 자산 ID" }
        destinationAssetId: { type: string, format: uuid, description: "TRANSFER 수정에서 사용하는 출발과 같은 명의이며 서로 다른 활성 BANK 계좌, SAVINGS 적금 또는 INVESTMENT 주식 계좌 자산 ID" }
        performedByMemberId: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        excludedFromStatistics:
          type: boolean
          default: false
          description: INCOME·EXPENSE에서만 사용하며 true면 잔액은 반영하고 달력·통계 집계에서 제외한다.
        statisticsAmountWon:
          type: integer
          format: int64
          minimum: 0
          description: EXPENSE에서만 사용하며 대표 결제의 달력·통계 반영액이다. 실제 결제액 이하이며 생략하면 amountWon과 같다.
    TransactionCategory:
