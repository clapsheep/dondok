        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: DONDOK_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 사용자의 동일 키·동일 payload 재시도는 기존 리소스의 동일 명령 결과를 반환한다.
      schema: { type: string, minLength: 1, maxLength: 100 }
  schemas:
    CardPaymentItem:
      type: object
      required: [chargeId, statementId, sourceTransactionId, installmentNo, installmentCount, occurredOn, description, cycleEnd, dueOn, remainingAmountWon, origin]
      properties:
        chargeId: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        sourceTransactionId: { type: string, format: uuid }
        installmentNo: { type: integer }
        installmentCount: { type: integer }
        occurredOn: { type: string, format: date }
        description: { type: string }
        cycleEnd: { type: string, format: date }
        dueOn: { type: string, format: date }
        remainingAmountWon: { type: integer, format: int64, minimum: 0 }
        origin: { type: string, enum: [PURCHASE, OPENING_BALANCE] }
    CardPaymentItemPage:
      type: object
      required: [items, nextCursor, recentClosingOn, snapshotToken, totals]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CardPaymentItem' } }
        nextCursor: { type: [string, 'null'] }
        recentClosingOn: { type: string, format: date }
        snapshotToken: { type: string }
        totals:
          type: object
          required: [amountWon, count, closedAmountWon, closedCount]
          properties:
            amountWon: { type: integer, format: int64 }
            count: { type: integer, format: int64 }
            closedAmountWon: { type: integer, format: int64 }
            closedCount: { type: integer, format: int64 }
    CardItemPaymentRequest:
      type: object
      required: [snapshotToken, mode, baseSelection, includedChargeIds, excludedChargeIds, settlementAssetId, paidOn]
      properties:
        snapshotToken: { type: string, minLength: 1, maxLength: 100 }
        mode: { type: string, enum: [SELECTED, AMOUNT] }
        baseSelection: { type: string, enum: [CLOSED, ALL, NONE] }
        includedChargeIds: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
        excludedChargeIds: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
        amountWon: { type: [integer, 'null'], format: int64, minimum: 1 }
        settlementAssetId: { type: string, format: uuid }
        paidOn: { type: string, format: date }
    CardItemPaymentResult:
      type: object
      required: [batchId, amountWon, payments]
      properties:
        batchId: { type: string, format: uuid }
        amountWon: { type: integer, format: int64 }
        payments:
          type: array
          items:
            type: object
            required: [paymentId, statementId, amountWon, cancelled]
            properties:
              paymentId: { type: string, format: uuid }
              statementId: { type: string, format: uuid }
              amountWon: { type: integer, format: int64 }
              cancelled: { type: boolean }
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string, const: X-CSRF-TOKEN }
        parameterName: { type: string }
        token: { type: string }
    SignUpRequest:
      type: object
      required: [loginId, displayName, email, password, consent]
      properties:
        loginId: { type: string, pattern: "^[A-Za-z0-9._-]{4,30}$" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        consent: { $ref: "#/components/schemas/SignUpConsent" }
    SignUpConsent:
      type: object
      required: [version, age14OrOlder, termsAccepted, privacyAccepted]
      properties:
        version: { type: string, description: GET /api/legal에서 확인한 동의 문서 버전 }
        age14OrOlder: { type: boolean, const: true }
        termsAccepted: { type: boolean, const: true }
        privacyAccepted: { type: boolean, const: true }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }
    AccountProfile:
      allOf:
        - { $ref: "#/components/schemas/SessionUser" }
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64, minimum: 0 }
    SessionUser:
      type: object
      required: [userId, loginId, displayName, email]
      properties:
        userId: { type: string, format: uuid }
        loginId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
    CurrentLedgerBook:
      type: object
      required: [ledger]
      properties:
        ledger:
          oneOf:
            - { $ref: "#/components/schemas/LedgerBook" }
            - { type: "null" }
    LedgerBook:
      type: object
      required: [ledgerId, version, members]
      properties:
        ledgerId: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        members:
          type: array
          items: { $ref: "#/components/schemas/LedgerMember" }
    LedgerBookDeletionRequest:
      type: object
      required: [expectedLedgerId, expectedVersion, confirmationPhrase]
      properties:
        expectedLedgerId:
          type: string
          format: uuid
          description: 삭제 확인 dialog를 열 때 보던 가계부 식별자. 삭제 후 새 가계부가 생긴 ABA 경합에서 새 가계부 삭제를 방지한다.
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        confirmationPhrase:
          type: string
          const: 가계부 삭제
          description: 실수로 전체 데이터를 지우지 않도록 사용자가 직접 입력한 확인 문구
    LedgerMember:
      type: object
      required: [memberId, displayName, joinedAt, currentUser]
      properties:
        memberId: { type: string, format: uuid }
        displayName: { type: string }
        joinedAt: { type: string, format: date-time }
        currentUser: { type: boolean }
        withdrawn: { type: boolean, description: 가계부별 시스템 구성원. 사용자 계정과 연결되지 않으며 로그인·가입·선택 주체로 사용할 수 없다. }
    LedgerInvitationSummary:
      type: object
      required: [invitationId, status, createdAt, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, REDEEMED, REVOKED, EXPIRED] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    IssuedLedgerInvitation:
      allOf:
        - { $ref: "#/components/schemas/LedgerInvitationSummary" }
        - type: object
          required: [code, inviteUrl]
          properties:
            code:
              type: string
              pattern: "^[0-9]{6}$"
              description: 사람이 직접 입력하는 숫자 6자리 코드
            inviteUrl: { type: string, format: uri }
    InvitationCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          description: 숫자 6자리 직접 입력 코드 또는 초대 URL에 포함된 고강도 token
          oneOf:
            - { type: string, pattern: "^[0-9]{6}$" }
            - { type: string, minLength: 32, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
    LedgerInvitationPreview:
      type: object
      required: [memberNames, memberCount, expiresAt]
      properties:
        memberNames:
          type: array
          items: { type: string }
        memberCount: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    AssetBehavior:
      type: string
      enum: [STANDARD, CREDIT_CARD, DEBIT_CARD, SAVINGS]
    AssetOwnershipScope:
      type: string
      enum: [PERSONAL]
      description: 호환을 위해 유지하는 고정값. 모든 자산은 구성원 한 명을 소유자로 지정한다.
    AssetType:
      type: object
      description: 사용자가 추가하거나 이름을 바꿀 수 없는 고정 시스템 자산 종류
      required: [assetTypeId, systemCode, name, behavior, paymentSourceCapable]
      properties:
        assetTypeId: { type: string, format: uuid }
        systemCode:
          type: string
          enum: [CASH, BANK, CREDIT_CARD, DEBIT_CARD, SAVINGS, INVESTMENT, LOAN, INSURANCE, OTHER]
        name: { type: string }
        behavior: { $ref: "#/components/schemas/AssetBehavior" }
        paymentSourceCapable: { type: boolean }
    CardSettingsInput:
      type: object
      description: 신용카드 생성·수정에서 필수이며 settlementAssetId는 카드와 같은 명의의 계좌여야 한다. 명의 불일치는 CROSS_MEMBER_ASSET_CONNECTION_NOT_ALLOWED(400).
      required: [statementClosingDay, paymentDay, paymentMonthOffset, settlementAssetId, autoSettlementEnabled]
      properties:
        statementClosingDay: { type: integer, minimum: 1, maximum: 31 }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        paymentMonthOffset: { type: integer, minimum: 0, maximum: 2 }
        settlementAssetId: { type: string, format: uuid }
        autoSettlementEnabled: { type: boolean, deprecated: true, description: "자동 정산은 제거됨. 요청 값은 false로 정규화하고 응답은 항상 false." }
    DebitCardSettingsInput:
      type: object
      description: 체크카드 생성·수정에서 필수이며 지출 posting이 차감될 결제 계좌를 지정한다.
      required: [paymentAssetId]
      properties:
        paymentAssetId: { type: string, format: uuid }
    SavingsSettingsInput:
      type: object
      description: 적금에서 자동이체를 사용할 때만 보내는 출금 계좌와 달력일 설정이다. 객체를 보내면 두 필드가 모두 필요하고, 자동이체를 사용하지 않으면 null이다. 자동 실행 정책은 별도 범위다.
      required: [transferAssetId, transferDay]
      properties:
        transferAssetId: { type: string, format: uuid }
        transferDay: { type: integer, minimum: 1, maximum: 31 }
    AssetInput:
      description: 금융기관·카드사 구분은 제거되었다. 이전 클라이언트의 financialInstitutionCode/cardIssuerCode 입력은 무시하며 저장하지 않는다.
      type: object
      required: [assetTypeId, ownershipScope, ownerMemberId, name, openedOn, openingBalanceWon]
      properties:
        assetTypeId:
          type: string
          format: uuid
          description: 현재 가계부의 고정 시스템 자산 종류 ID
        ownershipScope: { $ref: "#/components/schemas/AssetOwnershipScope" }
        ownerMemberId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        openedOn: { type: string, format: date }
        memo:
          oneOf:
            - { type: string, maxLength: 1000 }
            - { type: "null" }
        openingBalanceWon: { type: integer, format: int64 }
        cardSettings:
          description: CREDIT_CARD 유형에서는 필수, 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/CardSettingsInput" }
            - { type: "null" }
        debitCardSettings:
          description: DEBIT_CARD 유형에서는 필수, 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/DebitCardSettingsInput" }
            - { type: "null" }
        savingsSettings:
          description: SAVINGS 유형에서 자동이체를 설정할 때만 사용하며 설정하지 않으면 null이다. 그 외 유형에서는 null이어야 한다.
          oneOf:
            - { $ref: "#/components/schemas/SavingsSettingsInput" }
            - { type: "null" }
    CreateAssetRequest:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
    UpdateAssetRequest:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
        - type: object
          required: [expectedVersion, reassignTransactionsToNewOwner]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 0 }
            reassignTransactionsToNewOwner:
              type: boolean
              description: PERSONAL owner가 실제 변경될 때만 true를 허용하며 그 외에는 false다.
    CardSettings:
      type: object
      required: [statementClosingDay, paymentDay, paymentMonthOffset, settlementAssetId, autoSettlementEnabled]
      properties:
        statementClosingDay: { type: integer, minimum: 1, maximum: 31 }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        paymentMonthOffset: { type: integer, minimum: 0, maximum: 2 }
        settlementAssetId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        autoSettlementEnabled: { type: boolean, deprecated: true, description: "자동 정산은 제거됨. 요청 값은 false로 정규화하고 응답은 항상 false." }
    DebitCardSettings:
      allOf:
        - { $ref: "#/components/schemas/DebitCardSettingsInput" }
    SavingsSettings:
      allOf:
        - { $ref: "#/components/schemas/SavingsSettingsInput" }
    Asset:
      type: object
      required:
        - assetId
        - assetTypeId
        - systemCode
        - assetTypeName
        - behavior
        - paymentSourceCapable
        - ownershipScope
        - ownerMemberId
        - name
        - openedOn
        - memo
        - openingBalanceWon
        - currentBalanceWon
        - currentMonthCardPaymentDueWon
        - nextMonthCardPaymentDueWon
        - nearestCardPaymentDueOn
        - nearestCardPaymentDueWon
        - followingCardPaymentDueOn
        - followingCardPaymentDueWon
        - status
        - archivedAt
        - version
        - cardSettings
        - debitCardSettings
        - savingsSettings
      properties:
        assetId: { type: string, format: uuid }
        assetTypeId: { type: string, format: uuid }
        systemCode:
          type: string
          enum: [CASH, BANK, CREDIT_CARD, DEBIT_CARD, SAVINGS, INVESTMENT, LOAN, INSURANCE, OTHER]
        assetTypeName: { type: string }
        behavior: { $ref: "#/components/schemas/AssetBehavior" }
        paymentSourceCapable: { type: boolean }
        ownershipScope: { $ref: "#/components/schemas/AssetOwnershipScope" }
        ownerMemberId: { type: string, format: uuid }
        name: { type: string }
        openedOn: { type: string, format: date }
        memo:
          oneOf:
            - { type: string }
            - { type: "null" }
        openingBalanceWon: { type: integer, format: int64 }
        currentBalanceWon: { type: integer, format: int64 }
        currentMonthCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Asia/Seoul 기준 현재 달에 결제 예정인 이 자산의 미결제 카드 명세 합계이며 카드가 아니면 0이다.
        nextMonthCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Asia/Seoul 기준 다음 달에 결제 예정인 이 자산의 미결제 카드 명세 합계이며 카드가 아니면 0이다.
        nearestCardPaymentDueOn:
          description: 아직 결제되지 않은 카드 명세 중 가장 이른 결제일이며, 없거나 카드가 아니면 null이다. 결제일이 지난 미결제 명세도 누락하지 않는다.
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        nearestCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          description: nearestCardPaymentDueOn에 결제할 미결제 명세 합계이며, 없거나 카드가 아니면 0이다.
        followingCardPaymentDueOn:
          description: nearestCardPaymentDueOn 다음으로 이른 미결제 카드 명세의 결제일이며, 없거나 카드가 아니면 null이다.
          oneOf:
            - { type: string, format: date }
            - { type: "null" }
        followingCardPaymentDueWon:
          type: integer
          format: int64
          minimum: 0
          description: followingCardPaymentDueOn에 결제할 미결제 명세 합계이며, 없거나 카드가 아니면 0이다.
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        archivedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        version: { type: integer, format: int64 }
        cardSettings:
          oneOf:
            - { $ref: "#/components/schemas/CardSettings" }
            - { type: "null" }
        debitCardSettings:
          oneOf:
            - { $ref: "#/components/schemas/DebitCardSettings" }
            - { type: "null" }
        savingsSettings:
          oneOf:
            - { $ref: "#/components/schemas/SavingsSettings" }
            - { type: "null" }
    AssetRemovalDisposition:
      type: string
      enum: [DELETE, ARCHIVE]
    AssetRemovalBlockingLink:
      type: object
