    post:
      summary: 미결제 카드 명세 수동 전액 결제
      description: 자동 정산 여부·결제 예정일과 관계없이 남은 전액을 입력한 paidOn에 계좌에서 카드로 이체 기록한다. 이전 클라이언트가 paidOn을 생략하면 오늘(서울)을 사용한다. version·금액·결제 계좌가 달라지면 412로 거부한다. 같은 요청 키로 날짜를 바꾸면 409로 거부한다. 실제 은행 결제 요청은 수행하지 않는다.
      operationId: payCardStatementManually
