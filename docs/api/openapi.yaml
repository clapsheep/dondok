      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ReorderCategoriesRequest:
      type: object
      required: [kind, categories]
      properties:
        kind: { $ref: "#/components/schemas/CategoryKind" }
        categories:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CategoryOrderItem" }
    CategoryOrderItem:
      type: object
      required: [categoryId, expectedVersion]
      properties:
        categoryId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
