    Transaction:
      type: object
      required:
        - transactionId
        - type
        - transferSubtype
        - transferPurpose
        - managementType
        - relatedPurchaseTransactionId
        - cardPayment
        - occurredOn
        - amountWon
        - statisticsAmountWon
        - category
        - performedBy
        - createdBy
        - asset
        - description
        - excludedFromStatistics
        - postings
        - installmentCount
        - version
        - createdAt
        - updatedAt
      properties:
        transactionId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/TransactionType" }
        transferPurpose:
          oneOf:
            - { $ref: "#/components/schemas/TransferPurpose" }
            - { type: "null" }
        transferSubtype:
          oneOf:
            - { $ref: "#/components/schemas/TransferSubtype" }
            - { type: "null" }
        managementType:
          type: string
          enum: [GENERAL, CARD_PURCHASE, CARD_REFUND, SYSTEM]
        relatedPurchaseTransactionId:
          description: 카드 환불 거래가 연결된 원 구매 식별자이며 그 외에는 null이다.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        cardPayment:
          description: 카드 선결제·자동 정산 거래가 연결된 결제 기록이며 그 외에는 null이다.
          oneOf:
            - { $ref: "#/components/schemas/TransactionCardPaymentReference" }
            - { type: "null" }
        occurredOn: { type: string, format: date }
        amountWon: { type: integer, format: int64 }
        statisticsAmountWon:
          type: integer
          format: int64
          minimum: 0
          description: 달력·통계에 기여하는 금액이다. 대표 지출이 아니면 amountWon과 같다.
        category:
          oneOf:
            - { $ref: "#/components/schemas/TransactionCategory" }
            - { type: "null" }
        performedBy:
          description: 거래 주체. 카드 정산·선결제는 생성 시점의 카드 소유자이며 결제 계좌 소유자·작성자와 독립적이다.
          oneOf:
            - { $ref: "#/components/schemas/TransactionMember" }
            - { type: "null" }
        createdBy:
          oneOf:
            - { $ref: "#/components/schemas/TransactionMember" }
            - { type: "null" }
        asset:
          description: 수입·지출에서 사용자가 선택한 자산이다. 체크카드는 실제 posting 계좌와 다를 수 있다.
          oneOf:
            - { $ref: "#/components/schemas/TransactionAsset" }
            - { type: "null" }
        description:
          oneOf:
            - { type: string }
            - { type: "null" }
        excludedFromStatistics:
          type: boolean
          description: 사용자 선택으로 월간 달력·통계 집계에서 제외된 수입·지출인지 나타낸다.
        postings:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TransactionPosting" }
        installmentCount:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CardPurchaseBillingSnapshot:
      type: object
      required: [cardAssetId, cardAssetName, statementClosingDay, paymentDay, paymentMonthOffset, installmentCount]
      properties:
        cardAssetId: { type: string, format: uuid }
        cardAssetName: { type: string }
        statementClosingDay: { type: integer, minimum: 1, maximum: 31 }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        paymentMonthOffset: { type: integer, minimum: 0, maximum: 2 }
        installmentCount: { type: integer, minimum: 1, maximum: 60 }
    CardPurchaseCharge:
      type: object
      required: [chargeId, installmentNo, installmentCount, principalAmountWon, refundedAmountWon, refundableAmountWon, expectedSettlementOn, statementId]
      properties:
        chargeId: { type: string, format: uuid }
        installmentNo: { type: integer, minimum: 1 }
        installmentCount: { type: integer, minimum: 1 }
        principalAmountWon: { type: integer, format: int64, minimum: 1 }
        refundedAmountWon: { type: integer, format: int64, minimum: 0 }
        refundableAmountWon: { type: integer, format: int64, minimum: 0 }
        expectedSettlementOn: { type: string, format: date }
        statementId: { type: string, format: uuid }
    CardStatementPayment:
      type: object
      required: [paymentId, paymentType, settlementAssetId, settlementAssetName, amountWon, returnedAmountWon, effectiveAmountWon, paidOn, settlementTransactionId, createdByMemberId]
      properties:
        paymentId: { type: string, format: uuid }
        paymentType: { type: string, enum: [PREPAYMENT, REGULAR, MANUAL] }
        settlementAssetId: { type: string, format: uuid }
        settlementAssetName: { type: string }
        amountWon: { type: integer, format: int64, minimum: 1 }
        returnedAmountWon: { type: integer, format: int64, minimum: 0 }
        effectiveAmountWon: { type: integer, format: int64, minimum: 0 }
        paidOn: { type: string, format: date }
        settlementTransactionId: { type: string, format: uuid }
        createdByMemberId:
          description: 수동 선결제 작성자이며 자동 정기 결제는 null이다.
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
    CorrectCardStatementPaymentAccountRequest:
      type: object
      required: [settlementAssetId, expectedVersion]
      properties:
        settlementAssetId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    CardStatementSummary:
      type: object
      required: [statementId, cardAsset, dueOn, status, grossAmountWon, paidAmountWon, remainingAmountWon, additionalUsageAfterPayment, version, automaticSettlement]
      properties:
        statementId: { type: string, format: uuid }
        cardAsset: { $ref: "#/components/schemas/TransactionAsset" }
        dueOn: { type: string, format: date }
        status: { type: string, enum: [OPEN, FINALIZED, PAID, CANCELLED] }
        grossAmountWon: { type: integer, format: int64, minimum: 0 }
        paidAmountWon: { type: integer, format: int64, minimum: 0 }
        remainingAmountWon: { type: integer, format: int64, minimum: 0 }
        additionalUsageAfterPayment:
          type: boolean
          description: 결제일 당일 이후 전액 결제한 명세가 추가 사용으로 다시 열린 이력. true인 명세의 남은 금액은 수동 결제하며 자동 정산하지 않는다.
        version: { type: integer, format: int64, minimum: 0 }
        automaticSettlement:
          oneOf:
            - { $ref: "#/components/schemas/CardPaymentSchedule" }
            - { type: "null" }
    CardStatementDetail:
      allOf:
        - { $ref: "#/components/schemas/CardStatementSummary" }
        - type: object
          required: [prepayableAmountWon, settlementAsset, autoSettlementEnabled, payments]
          properties:
            prepayableAmountWon:
              type: integer
              format: int64
              minimum: 0
              description: 서버 현재 날짜와 명세 상태를 반영해 지금 선결제할 수 있는 최대 금액
            settlementAsset:
              description: 카드에 현재 설정된 단일 결제 계좌이며 미설정이면 null이다.
              oneOf:
                - { $ref: "#/components/schemas/CardSettlementAsset" }
                - { type: "null" }
            autoSettlementEnabled: { type: boolean, deprecated: true, description: "자동 정산은 제거됨. 요청 값은 false로 정규화하고 응답은 항상 false." }
            payments:
              type: array
              items: { $ref: "#/components/schemas/CardStatementPayment" }
    CardSettlementAsset:
      type: object
      required: [assetId, name, currentBalanceWon]
      properties:
        assetId: { type: string, format: uuid }
        name: { type: string }
        currentBalanceWon: { type: integer, format: int64 }
    CardPaymentSchedule:
      type: object
      required: [scheduleId, scheduledOn, status, attemptCount, nextRetryAt]
      properties:
        scheduleId: { type: string, format: uuid }
        scheduledOn: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, PROCESSING, COMPLETED, FAILED, CANCELLED] }
        attemptCount: { type: integer, minimum: 0 }
        nextRetryAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    CardStatementPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CardStatementSummary" }
        nextCursor:
          oneOf:
            - { type: string }
            - { type: "null" }
    CreateCardStatementPrepaymentRequest:
      type: object
      required: [amountWon, expectedVersion]
      properties:
        amountWon: { type: integer, format: int64, minimum: 1 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    ApplyCardStatementPrepaymentRequest:
      allOf:
        - { $ref: "#/components/schemas/CreateCardStatementPrepaymentRequest" }
        - type: object
          required: [previewToken]
          properties:
            previewToken: { type: string, minLength: 1, maxLength: 64 }
    CardStatementPrepaymentPreview:
      type: object
      required: [previewToken, statementVersion, amountWon, appliedOn, currentRemainingAmountWon, afterRemainingAmountWon, settlementAsset, afterSettlementAssetBalanceWon]
      properties:
        previewToken: { type: string }
        statementVersion: { type: integer, format: int64, minimum: 0 }
        amountWon: { type: integer, format: int64, minimum: 1 }
        appliedOn: { type: string, format: date }
        currentRemainingAmountWon: { type: integer, format: int64, minimum: 1 }
        afterRemainingAmountWon: { type: integer, format: int64, minimum: 0 }
        settlementAsset: { $ref: "#/components/schemas/CardSettlementAsset" }
        afterSettlementAssetBalanceWon: { type: integer, format: int64 }
    CardStatementPaymentResult:
      type: object
      required: [statement, payment, settlementTransaction]
      properties:
        statement: { $ref: "#/components/schemas/CardStatementDetail" }
        payment: { $ref: "#/components/schemas/CardStatementPayment" }
        settlementTransaction: { $ref: "#/components/schemas/Transaction" }
    CardPaymentCancellationResult:
      type: object
      required: [statement, cancelledPaymentId, cancelledTransactionId]
      properties:
        statement: { $ref: "#/components/schemas/CardStatementDetail" }
        cancelledPaymentId: { type: string, format: uuid }
        cancelledTransactionId: { type: string, format: uuid }
    CardPurchaseStatement:
      type: object
      required: [statementId, dueOn, status, grossAmountWon, paidAmountWon, paymentAmountWon, version, payments]
      properties:
        statementId: { type: string, format: uuid }
        dueOn: { type: string, format: date }
        status: { type: string, enum: [OPEN, FINALIZED, PAID, CANCELLED] }
        grossAmountWon: { type: integer, format: int64, minimum: 0 }
        paidAmountWon: { type: integer, format: int64, minimum: 0 }
        paymentAmountWon: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
        payments:
          type: array
          items: { $ref: "#/components/schemas/CardStatementPayment" }
    CardPurchaseAccountReturn:
      type: object
      required: [assetId, assetName, amountWon]
      properties:
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        amountWon: { type: integer, format: int64, minimum: 1 }
    CardPurchaseRefund:
      type: object
      required: [refundId, refundTransactionId, refundedOn, amountWon, statisticsAmountWon, excludedFromStatistics, unpaidCardReductionWon, accountReturns]
      properties:
        refundId: { type: string, format: uuid }
        refundTransactionId: { type: string, format: uuid }
        refundedOn: { type: string, format: date }
        amountWon: { type: integer, format: int64, minimum: 1 }
        statisticsAmountWon: { type: integer, format: int64, minimum: 0, description: 환불일 지출에서 차감하는 금액이다. }
        excludedFromStatistics: { type: boolean }
        unpaidCardReductionWon: { type: integer, format: int64, minimum: 0 }
        accountReturns:
          type: array
          items: { $ref: "#/components/schemas/CardPurchaseAccountReturn" }
    CardPurchaseManagement:
      type: object
      required: [purchase, billingSnapshot, refundableAmountWon, charges, statements, refunds]
      properties:
        purchase: { $ref: "#/components/schemas/Transaction" }
        billingSnapshot: { $ref: "#/components/schemas/CardPurchaseBillingSnapshot" }
        refundableAmountWon: { type: integer, format: int64, minimum: 0 }
        charges:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CardPurchaseCharge" }
        statements:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CardPurchaseStatement" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/CardPurchaseRefund" }
    CardPurchaseCorrectionRequest:
      type: object
      required: [occurredOn, amountWon, categoryId, cardAssetId, performedByMemberId, installmentCount, expectedVersion]
      properties:
        occurredOn: { type: string, format: date }
        amountWon: { type: integer, format: int64, minimum: 1 }
        statisticsAmountWon:
          type: integer
          format: int64
          minimum: 0
          description: 대표 결제의 지출 반영 금액이며 실제 구매액 이하이다. 생략하면 amountWon과 같다.
        categoryId: { type: string, format: uuid }
        cardAssetId: { type: string, format: uuid }
        performedByMemberId: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
        installmentCount: { type: integer, minimum: 1, maximum: 60 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        excludedFromStatistics:
          type: boolean
          default: false
          description: true면 카드 posting·명세는 반영하고 구매일 지출 집계에서 제외한다.
    ApplyCardPurchaseCorrectionRequest:
      allOf:
        - { $ref: "#/components/schemas/CardPurchaseCorrectionRequest" }
        - type: object
          required: [previewToken]
          properties:
            previewToken: { type: string, minLength: 1, maxLength: 128 }
    CardPurchaseCorrectionPreview:
      type: object
      required: [previewToken, purchaseVersion, unpaidCardReductionWon, accountReturns]
      properties:
        previewToken: { type: string }
        purchaseVersion: { type: integer, format: int64, minimum: 0 }
        unpaidCardReductionWon: { type: integer, format: int64, minimum: 0 }
        accountReturns:
          type: array
          items: { $ref: "#/components/schemas/CardPurchaseAccountReturn" }
    CardPurchaseRefundRequest:
      type: object
      required: [refundedOn, amountWon, expectedVersion]
      properties:
        refundedOn: { type: string, format: date }
        amountWon: { type: integer, format: int64, minimum: 1 }
        statisticsAmountWon:
          type: integer
          format: int64
          minimum: 0
          description: 환불일 지출에서 차감할 금액이며 환불액과 원 구매의 남은 지출 반영액 이하여야 한다. 생략하면 amountWon과 같다.
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        description: { type: string, maxLength: 500 }
        excludedFromStatistics:
          type: boolean
          default: false
          description: true면 환불 posting은 반영하고 환불일 지출 집계에서는 제외한다.
    ApplyCardPurchaseRefundRequest:
      allOf:
        - { $ref: "#/components/schemas/CardPurchaseRefundRequest" }
        - type: object
          required: [previewToken]
          properties:
            previewToken: { type: string, minLength: 1, maxLength: 128 }
    CardPurchaseRefundPreview:
      type: object
      required: [previewToken, purchaseVersion, refundableAmountWon, unpaidCardReductionWon, accountReturns]
      properties:
        previewToken: { type: string }
        purchaseVersion: { type: integer, format: int64, minimum: 0 }
        refundableAmountWon: { type: integer, format: int64, minimum: 0 }
        unpaidCardReductionWon: { type: integer, format: int64, minimum: 0 }
        accountReturns:
          type: array
          items: { $ref: "#/components/schemas/CardPurchaseAccountReturn" }
    CardPurchaseRefundResult:
      type: object
      required: [purchase, refundTransaction, unpaidCardReductionWon, accountReturns]
      properties:
        purchase: { $ref: "#/components/schemas/Transaction" }
        refundTransaction: { $ref: "#/components/schemas/Transaction" }
        unpaidCardReductionWon: { type: integer, format: int64, minimum: 0 }
        accountReturns:
          type: array
          items: { $ref: "#/components/schemas/CardPurchaseAccountReturn" }
    DeletedTransaction:
      type: object
      required: [transactionId, deletedVersion]
      properties:
        transactionId: { type: string, format: uuid }
        deletedVersion: { type: integer, format: int64, minimum: 1 }
    TransactionDaySummary:
      type: object
      required: [date, incomeWon, expenseWon, netWon, cardPaymentWon, transactionCount]
      properties:
        date: { type: string, format: date }
        incomeWon: { type: integer, format: int64 }
        expenseWon: { type: integer, format: int64 }
        netWon: { type: integer, format: int64 }
        cardPaymentWon:
          type: integer
          format: int64
          minimum: 0
          description: 해당 날짜 카드 정산·선결제 금액 합계. 수입·지출·순액에는 포함하지 않으며 카드 명의자의 기록으로 조회한다.
        transactionCount:
          type: integer
          format: int64
          minimum: 0
          description: 해당 날짜 달력 합계에 반영되는 수입·지출·환불·카드결제의 거래 건수. 거래당 한 건으로 세며 일반 이체·집계 제외·삭제·기준일 잔액 기록은 제외한다. 금액과 같은 구성원 필터를 적용한다.
    TransactionCalendar:
      type: object
      required: [month, totalIncomeWon, totalExpenseWon, netWon, days]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        totalIncomeWon: { type: integer, format: int64 }
        totalExpenseWon: { type: integer, format: int64 }
        netWon: { type: integer, format: int64 }
        days:
          type: array
          items: { $ref: "#/components/schemas/TransactionDaySummary" }
    MonthlyStatistics:
      type: object
      required: [month, periodStart, periodEndExclusive, appliedFilters, totals, categoryBreakdown, yearlyTrend, assetFormation]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        periodStart: { type: string, format: date }
        periodEndExclusive: { type: string, format: date }
        appliedFilters: { $ref: "#/components/schemas/StatisticsAppliedFilters" }
        totals: { $ref: "#/components/schemas/StatisticsTotals" }
        assetFormation: { $ref: "#/components/schemas/AssetFormation" }
        categoryBreakdown:
          type: array
          description: 방향별 순금액 내림차순이며 환불 때문에 지출 금액이 음수일 수 있다.
          items: { $ref: "#/components/schemas/StatisticsCategoryAmount" }
        yearlyTrend:
          type: array
          minItems: 12
          maxItems: 12
          description: 선택 월이 속한 연도의 1월부터 12월까지 같은 필터로 집계하며 0원인 달도 포함한다.
          items: { $ref: "#/components/schemas/StatisticsMonthSummary" }
        dailyTrend:
          type: array
          maxItems: 0
          deprecated: true
          description: 이전 PWA 앱 셸의 안전한 갱신을 위한 빈 호환 필드이며 새 클라이언트는 사용하지 않는다.
          items: { $ref: "#/components/schemas/TransactionDaySummary" }
    StatisticsAppliedFilters:
      type: object
      required: [performedByMemberId, assetOwnerType, assetOwnerMemberId, categoryId]
      properties:
        performedByMemberId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        assetOwnerType: { type: string, enum: [ALL, MEMBER] }
        assetOwnerMemberId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        categoryId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
    StatisticsTotals:
      type: object
      required: [incomeWon, expenseWon, netWon]
      properties:
        incomeWon: { type: integer, format: int64 }
        expenseWon: { type: integer, format: int64 }
        netWon: { type: integer, format: int64 }
    AssetFormation:
      type: object
      required: [savingsDepositWon, savingsWithdrawalWon, investmentDepositWon, investmentWithdrawalWon]
      description: 총 사용액은 소비+두 납입액이며 회수는 별도다. 각 순납입은 납입−회수. 목적별 주체 필터와 납입 도착/인출 출발 자산 소유자 필터를 적용하며 categoryId 지정 시 모두 0이다.
      properties:
        savingsDepositWon: { type: integer, format: int64, minimum: 0 }
        savingsWithdrawalWon: { type: integer, format: int64, minimum: 0 }
        investmentDepositWon: { type: integer, format: int64, minimum: 0 }
        investmentWithdrawalWon: { type: integer, format: int64, minimum: 0 }
    StatisticsMonthSummary:
      type: object
      required: [month, incomeWon, expenseWon, netWon, assetFormation]
      properties:
        assetFormation: { $ref: "#/components/schemas/AssetFormation" }
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        incomeWon: { type: integer, format: int64 }
        expenseWon: { type: integer, format: int64 }
        netWon: { type: integer, format: int64 }
    StatisticsCategoryAmount:
      type: object
      required: [categoryId, categoryName, kind, amountWon]
      properties:
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        kind: { type: string, enum: [INCOME, EXPENSE] }
        amountWon: { type: integer, format: int64 }
    StatisticsCategoryTransactionPage:
      type: object
      required: [month, categoryId, categoryName, items, nextCursor]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/StatisticsCategoryTransaction" }
        nextCursor:
          oneOf:
            - { type: string }
            - { type: "null" }
    StatisticsCategoryTransaction:
      type: object
      required: [transactionId, occurredOn, kind, statisticsContributionWon, categoryName, assetId, assetName, performedByMemberId, performedByName]
      properties:
        transactionId: { type: string, format: uuid }
        occurredOn: { type: string, format: date }
        kind: { type: string, enum: [INCOME, EXPENSE] }
        statisticsContributionWon:
          type: integer
          format: int64
          description: 수입·지출 합계에 미치는 signed 순액이며 지출은 음수, 지출 환불은 양수다.
        description:
          oneOf:
            - { type: string }
            - { type: "null" }
        categoryName: { type: string }
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        performedByMemberId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        performedByName:
          oneOf:
            - { type: string }
            - { type: "null" }
    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          oneOf:
            - { type: string }
            - { type: "null" }
    Problem:
      type: object
      required: [status, title, detail, errorCode, correlationId, timestamp, fieldErrors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errorCode: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: true
  responses:
    BadRequest:
      description: 입력값 또는 token 오류
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: 인증 실패
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: 이메일 미인증 또는 CSRF 오류
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: 현재 상태와 충돌하는 요청
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: 현재 사용자가 접근할 수 있는 리소스가 없음
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    PreconditionFailed:
      description: 편집 시작 후 다른 세션이 리소스를 수정함
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TooManyRequests:
      description: 짧은 초대 코드의 반복 확인 제한 초과
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ServiceUnavailable:
      description: 고유한 초대 코드를 일시적으로 발급할 수 없음
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
