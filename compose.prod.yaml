services:
  backend:
    environment:
      DONDOK_COOKIE_SECURE: "true"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DONDOK_DOMAIN: ${DONDOK_DOMAIN:?DONDOK_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
