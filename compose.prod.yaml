services:
  db:
    mem_limit: 2g
    cpus: 1.5
    ports:
      - "${DONDOK_DB_BIND_HOST:-127.0.0.1}:${DONDOK_DB_HOST_PORT:-15432}:5432"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    mem_limit: 1g
    cpus: 1.5
    environment:
      DONDOK_COOKIE_SECURE: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:${DONDOK_FRONTEND_PORT:-18080}:8080"
    volumes:
      - ./infra/nginx-rate-limits.conf:/etc/nginx/conf.d/00-rate-limits.conf:ro
      - ./infra/nginx-server-security.conf:/etc/nginx/dondok/server-security/production.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
