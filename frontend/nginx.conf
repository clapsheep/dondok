map $http_x_forwarded_proto $dondok_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  include /etc/nginx/dondok/server-security/*.conf;

  location /api/ {
    include /etc/nginx/dondok/api-proxy.conf;
  }

  location ~* ^/assets/.+\.(?:js|css|map|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
